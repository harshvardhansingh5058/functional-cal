<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style(2).css">
  <link rel="stylesheet" href="css/res.css">
</head>

<body>

  <div class="grid">

    <!-- ===== BMI CARD ===== -->
    <div class="card card-bmi">
      <div class="card-title">
        <span class="title-dot dot-cyan"></span>
        BMI &amp; Calories
      </div>

      <div class="avatars">
        <div class="avatar-wrap active" id="male-avatar" onclick="selectGender('male')">
          <div class="avatar-circle">🧑</div>
          <span class="avatar-label">Male</span>
        </div>
        <div class="avatar-wrap" id="female-avatar" onclick="selectGender('female')">
          <div class="avatar-circle">👩</div>
          <span class="avatar-label">Female</span>
        </div>
      </div>

      <div class="toggle-row">
        <input type="radio" name="gender" id="boy" checked>
        <label for="boy">Male</label>
        <input type="radio" name="gender" id="girl">
        <label for="girl">Female</label>
        <div class="toggle-pill pill-cyan"></div>
      </div>

      <div class="fields">
        <div class="field field-bmi">
          <span class="field-icon">🎂</span>
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Years" min="1" max="120">
        </div>
        <div class="field field-bmi">
          <span class="field-icon">⚖️</span>
          <label for="weight">Weight</label>
          <input type="number" id="weight" placeholder="Kilograms" min="1">
        </div>
        <div class="field field-bmi">
          <span class="field-icon">📏</span>
          <label for="height">Height</label>
          <input type="number" id="height" placeholder="Centimeters" min="1">
        </div>
        <div class="field field-bmi">
          <span class="field-icon">🏃</span>
          <label for="activity">Activity</label>
          <select id="activity">
            <option value="1.2">Sedentary</option>
            <option value="1.375">Lightly Active</option>
            <option value="1.55">Moderately Active</option>
            <option value="1.725">Active</option>
            <option value="1.9">Very Active</option>
          </select>
        </div>
      </div>

      <div class="spacer"></div>

      <!-- id="bmi-result" — script.js yahi dhundta hai -->
      <div class="result-box" id="bmi-result">
        <span class="result-placeholder">Enter your details and calculate</span>
        <div class="result-content">
          <div class="result-main cyan" id="bmi-val">—</div>
          <div class="result-sub">
            <span class="result-tag" id="bmi-tag"></span>
          </div>
          <div class="result-sub" id="bmi-cal"></div>
        </div>
      </div>

      <div class="spacer"></div>
      <button class="btn btn-cyan" onclick="calcBMI()">Calculate BMI &amp; Calories</button>
    </div>

    <!-- ===== INTEREST CARD ===== -->
    <div class="card card-interest">
      <div class="card-title">
        <span class="title-dot dot-amber"></span>
        Interest Calculator
      </div>

      <div class="calc-banner">
        <div class="banner-visual">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <span class="banner-label">GROWTH</span>
      </div>

      <div class="toggle-row">
        <input type="radio" name="interest" id="simple" checked>
        <label for="simple">Simple Interest</label>
        <input type="radio" name="interest" id="compound">
        <label for="compound">Compound Interest</label>
        <div class="toggle-pill pill-amber"></div>
      </div>

      <div class="fields">
        <div class="field field-amber">
          <span class="field-icon">💰</span>
          <label for="principal">Principal</label>
          <input type="number" id="principal" placeholder="Amount (₹)" min="0">
        </div>
        <div class="field field-amber">
          <span class="field-icon">📈</span>
          <!-- id="rate" — script.js yahi dhundta hai (original mein 'interest' tha — FIX kiya) -->
          <label for="rate">Rate</label>
          <input type="number" id="rate" placeholder="% per year" min="0" step="0.01">
        </div>
        <div class="field field-amber">
          <span class="field-icon">🗓️</span>
          <label for="time">Time</label>
          <input type="number" id="time" placeholder="Years" min="0" step="0.5">
        </div>
      </div>

      <div class="spacer"></div>

      <!-- id="int-result" — script.js yahi dhundta hai -->
      <div class="result-box" id="int-result">
        <span class="result-placeholder">Enter values and evaluate</span>
        <div class="result-content">
          <div class="result-main amber" id="int-total">—</div>
          <div class="result-sub" id="int-type-label"></div>
        </div>
      </div>

      <!-- Detail chips — visible class JS se lagta hai -->
      <div class="interest-details" id="int-details">
        <div class="detail-chip">
          <div class="chip-label">Interest Earned</div>
          <div class="chip-val amber" id="int-earned">—</div>
        </div>
        <div class="detail-chip">
          <div class="chip-label">Total Amount</div>
          <div class="chip-val" id="int-amount">—</div>
        </div>
        <div class="detail-chip">
          <div class="chip-label">Principal</div>
          <div class="chip-val" id="int-principal">—</div>
        </div>
        <div class="detail-chip">
          <div class="chip-label">Rate × Time</div>
          <div class="chip-val" id="int-rt">—</div>
        </div>
      </div>

      <div class="spacer"></div>
      <button class="btn btn-amber" onclick="calcInterest()">Evaluate</button>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
